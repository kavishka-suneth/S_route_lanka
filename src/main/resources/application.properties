spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartroute_lanka_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root1234}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:SmartRouteLocalDevelopmentJwtSecretMustBeAtLeast32BytesLong123}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Email OTP (use environment variables; never commit real credentials)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.development-fallback=${MAIL_DEVELOPMENT_FALLBACK:true}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.wallet.min-top-up=${WALLET_MIN_TOP_UP:100.00}
app.wallet.max-top-up=${WALLET_MAX_TOP_UP:50000.00}
app.otp.cleanup-ms=${OTP_CLEANUP_MS:3600000}
app.booking.hold-minutes=${BOOKING_HOLD_MINUTES:10}
app.booking.hold-cleanup-ms=${BOOKING_HOLD_CLEANUP_MS:60000}
app.cancellation.full-refund-hours=${CANCELLATION_FULL_REFUND_HOURS:24}
app.cancellation.partial-refund-hours=${CANCELLATION_PARTIAL_REFUND_HOURS:6}
app.cancellation.partial-refund-percent=${CANCELLATION_PARTIAL_REFUND_PERCENT:50}
