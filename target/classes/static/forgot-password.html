<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | SmartRoute Lanka</title><link rel="icon" href="/assets/smartroute-mark.svg"><link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/premium.css"><script defer src="/js/config.js"></script><script defer src="/js/auth.js"></script><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script>
  <script defer src="/js/premium.js"></script><script defer src="/js/forgot-password.js"></script></head><body data-page="forgot-password"><div id="siteNav"></div><main class="auth-shell" id="mainContent"><aside class="auth-story"><img src="/assets/bus-hero.webp" alt="Bus travelling through Sri Lanka"><div class="auth-story-copy"><span class="hero-kicker">ACCOUNT RECOVERY</span><h2>Get back<br>on your<br><em>journey.</em></h2><p>Secure email OTP verification for your SmartRoute account.</p></div></aside><div class="auth-panel"><div class="page-title"><div><span class="mini-label">SECURE RECOVERY</span><h1>Reset password.</h1><p class="section-lead">We will send a 6-digit verification code if the account exists.</p></div></div><div id="pageAlert"></div>
<form id="requestResetForm" class="card form-grid"><div class="form-row full"><label>Email<input name="email" type="email" autocomplete="email" required></label></div><div class="actions full"><button class="btn btn-primary" type="submit">Send verification code</button><a class="btn btn-ghost" href="/login.html">Back to login</a></div></form>
<form id="verifyResetForm" class="card form-grid" hidden><div class="form-row full"><label>6-digit code<input name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></label></div><div class="actions full"><button class="btn btn-primary" type="submit">Verify code</button></div></form>
<form id="newPasswordForm" class="card form-grid" hidden><div class="form-row full"><label>New password<input name="newPassword" type="password" autocomplete="new-password" required></label><small class="muted">8+ chars with upper/lowercase, number and special character.</small></div><div class="form-row full"><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" required></label></div><div class="actions full"><button class="btn btn-primary" type="submit">Reset password</button></div></form>
</div></main><div id="siteFooter"></div></body></html>
